services:
  hu4ks6uhma:
    container_name: hu4ks6uhma_app
    image: ghcr.io/mr-devloper005/maytapbung.net:latest
    env_file:
      - .env
    network_mode: bridge
    restart: always
    ports:
      - "127.0.0.1:3222:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5m
      timeout: 3s
      retries: 2
